# Ogni quante ore controllare GitHub. Minimo: 1 ora.
check-interval-hours: 6

# Se true, una nuova release viene scaricata in plugins/update e installata
# automaticamente al successivo riavvio completo del server.
download-updates: true

# Esegue un controllo poco dopo l'avvio del server.
check-on-startup: true

# Se true mostra le tracce complete degli errori di rete. Lasciare false per
# mantenere la console pulita e visualizzare soltanto un avviso sintetico.
show-stack-traces: false

# Dopo un aggiornamento riuscito elimina dalla cartella plugins i JAR con lo
# stesso nome interno ma con una versione precedente a quella caricata.
delete-old-jars: true

# Opzionale: aumenta il limite delle richieste GitHub. Non serve normalmente.
# Il token non viene mai scritto nei log.
github-token: ''

plugins:
  ViaVersion:
    enabled: true
    # release = ultima versione stabile GitHub; dev = ultima build CI ufficiale.
    channel: release
    repository: ViaVersion/ViaVersion
    dev-job-url: https://ci.viaversion.com/job/ViaVersion
    asset-regex: '^ViaVersion-[0-9].*\.jar$'
  ViaBackwards:
    enabled: true
    channel: release
    repository: ViaVersion/ViaBackwards
    dev-job-url: https://ci.viaversion.com/view/ViaBackwards/job/ViaBackwards
    asset-regex: '^ViaBackwards-[0-9].*\.jar$'
  # Opzionale: viene ignorato automaticamente se ViaRewind non è installato.
  ViaRewind:
    enabled: true
    channel: release
    repository: ViaVersion/ViaRewind
    dev-job-url: https://ci.viaversion.com/view/ViaRewind/job/ViaRewind
    asset-regex: '^ViaRewind-[0-9].*\.jar$'
  ProtocolLib:
    enabled: true
    channel: release
    repository: dmulloy2/ProtocolLib
    # ProtocolLib pubblica le build dev su una release GitHub a tag fisso.
    dev-release-tag: dev-build
    asset-regex: '^ProtocolLib(?:-Spigot)?\.jar$'
  packetevents:
    enabled: true
    channel: release
    repository: retrooper/packetevents
    dev-job-url: https://ci.codemc.io/job/retrooper/job/packetevents
    asset-regex: '^packetevents-spigot-(?!.*-(?:javadoc|sources)\.jar$)[0-9].*\.jar$'
  SkinsRestorer:
    enabled: true
    channel: release
    repository: SkinsRestorer/SkinsRestorer
    dev-job-url: https://ci.codemc.io/job/SkinsRestorer/job/SkinsRestorer
    asset-regex: '^SkinsRestorer\.jar$'
  floodgate:
    enabled: true
    # Floodgate viene distribuito come build ufficiale continua da GeyserMC.
    channel: dev
    repository: GeyserMC/Floodgate
    geyser-platform: spigot
    asset-regex: '^floodgate-spigot\.jar$'
