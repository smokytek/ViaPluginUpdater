# PluginUpdater settings for Velocity
check-interval-hours=6
show-stack-traces=false
github-token=

# release = stable GitHub release; dev = latest official CodeMC build
skinsrestorer-channel=release

# Update the proxy itself from the latest stable PaperMC Velocity build.
# The filename must be located in the proxy root directory.
velocity-update-enabled=true
velocity-jar=velocity.jar

# Restart the proxy through the Pterodactyl Client API only when a new
# Velocity build has been downloaded. Create a Client API key with restart
# permission for this server. HTTPS is required unless allow-http is enabled.
pterodactyl-restart-enabled=false
pterodactyl-panel-url=https://panel.example.com
pterodactyl-server-id=
pterodactyl-client-api-token=
pterodactyl-allow-http=false
restart-hour=3
restart-zone=Europe/Rome
